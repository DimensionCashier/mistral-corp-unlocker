<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#101830"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#2d4a7a;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2d4a7a;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#4a9eff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="120" fill="none" stroke="#4a9eff" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="1100" cy="280" r="150" fill="none" stroke="#4a9eff" stroke-opacity="0.05" stroke-width="1.5"/>
  <circle cx="950" cy="60" r="60" fill="none" stroke="#6ab0ff" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="200" cy="300" r="40" fill="none" stroke="#6ab0ff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Accent lines -->
  <line x1="150" y1="180" x2="1050" y2="180" stroke="url(#accentLine)" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="200" y1="185" x2="1000" y2="185" stroke="#4a9eff" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="250" y1="175" x2="950" y2="175" stroke="#4a9eff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Grid dots pattern -->
  <g fill="#4a9eff" fill-opacity="0.1">
    <circle cx="80" cy="50" r="1.5"/>
    <circle cx="160" cy="120" r="1"/>
    <circle cx="240" cy="40" r="1.5"/>
    <circle cx="320" cy="90" r="1"/>
    <circle cx="400" cy="30" r="1.5"/>
    <circle cx="480" cy="100" r="1"/>
    <circle cx="560" cy="45" r="1.5"/>
    <circle cx="640" cy="110" r="1"/>
    <circle cx="720" cy="35" r="1.5"/>
    <circle cx="800" cy="95" r="1"/>
    <circle cx="880" cy="50" r="1.5"/>
    <circle cx="960" cy="105" r="1"/>
    <circle cx="1040" cy="40" r="1.5"/>
    <circle cx="1120" cy="85" r="1"/>
    <circle cx="130" cy="280" r="1"/>
    <circle cx="260" cy="310" r="1.5"/>
    <circle cx="390" cy="270" r="1"/>
    <circle cx="520" cy="320" r="1.5"/>
    <circle cx="650" cy="275" r="1"/>
    <circle cx="780" cy="315" r="1.5"/>
    <circle cx="910" cy="270" r="1"/>
    <circle cx="1040" cy="310" r="1.5"/>
    <circle cx="1150" cy="280" r="1"/>
  </g>

  <!-- Subtle corner accents -->
  <path d="M30,30 L80,30 M30,30 L30,80" stroke="#4a9eff" stroke-opacity="0.15" stroke-width="1.5"/>
  <path d="M1170,330 L1120,330 M1170,330 L1170,280" stroke="#4a9eff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Headline -->
  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52.0" font-weight="bold" fill="#ffffff">
    Mistral Large 4
    <tspan x="600" dy="58" font-size="48.0">Corporate Unlocker</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    Lightweight deployment helpers for teams running Mistral Large 4 Corporate —
  </text>
  <text x="600" y="298" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    streamline config checks and license validation with ease.
  </text>
</svg>